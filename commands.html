<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Room Location Add-in</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
<script type="text/javascript">

/* ================= الإعدادات ================= */

var CONFIG = {
  mapUrl: "https://maps.google.com/?q=21.548840,39.136276",
  addressLine1: "Modern Mills Company &ndash; HQ",
  addressLine2: "Moh. Attaib Attunsi St, Jeddah, Makkah JEKD2698, SA",

  receptionPhone: "",
  receptionLabel: "Reception",

  // ===== قاعدة الحد الأدنى للإشغال =====
  // 0.5 = لازم الحضور 50% من سعة الغرفة على الأقل
  // 0   = القاعدة معطّلة
  minOccupancy: 0.5,

  // كل الغرف وتفاصيلها
  // enabled: true  = الإضافة تشتغل على هالغرفة
  // enabled: false = تتجاهلها
  rooms: {
    "intelligence@modernmills.com.sa":  { name: "INTELLIGENCE",  floor: "Ground floor (GF)", seats: 4,  enabled: true  },
    "excellence@modernmills.com.sa":    { name: "EXCELLENCE",    floor: "Ground floor (GF)", seats: 5,  enabled: true },
    "integrity@modernmills.com.sa":     { name: "INTEGRITY",     floor: "2nd floor",         seats: 4,  enabled: true },
    "ownership@modernmills.com.sa":     { name: "OWNERSHIP",     floor: "2nd floor",         seats: 14, enabled: true },
    "collaboration@modernmills.com.sa": { name: "COLLABORATION", floor: "2nd floor",         seats: 4,  enabled: true },
    "cordial@modernmills.com.sa":       { name: "MOTIVATION",    floor: "2nd floor",         seats: 7,  enabled: true },
    "visionaries@modernmills.com.sa":   { name: "VISIONARIES",   floor: "2nd floor",         seats: 4,  enabled: true }
  }
};

/* ============================================= */

var MARKER = "MM-LOC-BLOCK";

Office.onReady(function () { });


/* ---------- بناء البلوك ---------- */

function buildBlock(organizerName, room) {

  var roomRow = "";
  if (room) {
    var parts = ["<b>" + room.name + "</b>"];
    if (room.floor) { parts.push(room.floor); }
    if (room.seats) { parts.push(room.seats + " seats"); }
    roomRow = '<div style="font-size:12px;color:#0C447C;margin-bottom:4px;">' +
              parts.join(" &middot; ") + "</div>";
  }

  var rows = [];
  if (organizerName) { rows.push("Organizer: " + organizerName); }
  if (CONFIG.receptionPhone) {
    rows.push(CONFIG.receptionLabel + ': <a href="tel:' +
      CONFIG.receptionPhone.replace(/\s/g, "") +
      '" style="color:#185FA5;">' + CONFIG.receptionPhone + "</a>");
  }

  var footer = rows.length
    ? '<div style="margin-top:8px;padding-top:6px;border-top:1px solid #B5D4F4;' +
      'font-size:12px;color:#185FA5;line-height:1.6;">' + rows.join("<br>") + "</div>"
    : "";

  return '<div id="' + MARKER + '" style="margin-top:16px;padding:12px 14px;' +
  'border:1px solid #B5D4F4;border-radius:6px;background:#E6F1FB;' +
  'font-family:Segoe UI,Arial,sans-serif;">' +
    '<div style="font-size:13px;font-weight:600;color:#0C447C;margin-bottom:5px;">' +
      'Meeting location / &#1605;&#1608;&#1602;&#1593; &#1575;&#1604;&#1575;&#1580;&#1578;&#1605;&#1575;&#1593;' +
    '</div>' +
    roomRow +
    '<div style="font-size:12px;color:#185FA5;line-height:1.6;">' +
      CONFIG.addressLine1 + '<br>' + CONFIG.addressLine2 +
    '</div>' +
    '<div style="margin-top:6px;">' +
      '<a href="' + CONFIG.mapUrl + '" style="font-size:12px;color:#185FA5;">Open in Google Maps</a>' +
    '</div>' + footer +
  '</div>';
}


/* ---------- هل هذا العنوان غرفة؟ ---------- */

function isRoomAddress(addr) {
  if (!addr) { return false; }
  return CONFIG.rooms.hasOwnProperty(String(addr).toLowerCase());
}


/* ---------- البحث عن غرفة في أي نص ---------- */

function findRoom(haystack) {
  if (!haystack) { return null; }
  var hay = String(haystack).toLowerCase();

  for (var email in CONFIG.rooms) {
    if (!CONFIG.rooms.hasOwnProperty(email)) { continue; }
    var r = CONFIG.rooms[email];
    if (!r.enabled) { continue; }

    if (hay.indexOf(email) !== -1) { return r; }
    if (r.name && hay.indexOf(r.name.toLowerCase()) !== -1) { return r; }
  }
  return null;
}


/* ---------- نقطة الدخول ---------- */

function onAppointmentSendHandler(event) {
  try {
    var item = Office.context.mailbox.item;
    if (!item) { event.completed({ allowEvent: true }); return; }

    var found = null;

    var step2 = function () {
      if (!found && item.location && item.location.getAsync) {
        item.location.getAsync(function (locRes) {
          if (locRes.status === Office.AsyncResultStatus.Succeeded) {
            found = findRoom(locRes.value);
          }
          step3();
        });
      } else {
        step3();
      }
    };

    var step3 = function () {
      if (!found && item.requiredAttendees && item.requiredAttendees.getAsync) {
        item.requiredAttendees.getAsync(function (attRes) {
          if (attRes.status === Office.AsyncResultStatus.Succeeded) {
            var list = attRes.value || [];
            for (var i = 0; i < list.length && !found; i++) {
              found = findRoom(list[i].emailAddress) || findRoom(list[i].displayName);
            }
          }
          finish();
        });
      } else {
        finish();
      }
    };

    var finish = function () {
      if (!found) { event.completed({ allowEvent: true }); return; }
      checkOccupancy(item, event, found);
    };

    if (item.enhancedLocation && item.enhancedLocation.getAsync) {
      item.enhancedLocation.getAsync(function (res) {
        if (res.status === Office.AsyncResultStatus.Succeeded) {
          var locs = res.value || [];
          for (var i = 0; i < locs.length && !found; i++) {
            found = findRoom(locs[i].emailAddress) || findRoom(locs[i].displayName);
          }
        }
        step2();
      });
    } else {
      step2();
    }

  } catch (e) {
    event.completed({ allowEvent: true });
  }
}


/* ---------- فحص الحد الأدنى للإشغال ---------- */

function checkOccupancy(item, event, room) {

  var ratio = CONFIG.minOccupancy;

  if (!ratio || ratio <= 0 || !room.seats) {
    appendBlock(item, event, room);
    return;
  }

  var needed = Math.ceil(room.seats * ratio);

  item.requiredAttendees.getAsync(function (reqRes) {
    item.optionalAttendees.getAsync(function (optRes) {

      var people = 1; // المنظّم
      var all = (reqRes.value || []).concat(optRes.value || []);

      for (var i = 0; i < all.length; i++) {
        if (!isRoomAddress(all[i].emailAddress)) { people++; }
      }

      if (people < needed) {

        var msg =
          room.name + " seats " + room.seats + " people. This meeting has only " +
          people + " attendee(s), below the recommended minimum of " + needed +
          " (" + Math.round(ratio * 100) + "% of capacity). " +
          "Consider a smaller room. You can still send this invitation.";

        // تنبيه قابل للتجاوز - يتجاوز إعداد المانيفست إن كان العميل يدعمه
        try {
          event.completed({
            allowEvent: false,
            errorMessage: msg,
            sendModeOverride: Office.MailboxEnums.SendModeOverride.PromptUser
          });
        } catch (e) {
          event.completed({ allowEvent: false, errorMessage: msg });
        }
        return;
      }

      appendBlock(item, event, room);
    });
  });
}


/* ---------- إدراج البلوك ---------- */

function appendBlock(item, event, room) {

  var name = "";
  try { name = Office.context.mailbox.userProfile.displayName || ""; } catch (e) { }

  item.body.getAsync(Office.CoercionType.Html, function (bodyResult) {

    var current = (bodyResult.status === Office.AsyncResultStatus.Succeeded &&
                   bodyResult.value) ? bodyResult.value : "";

    if (current.indexOf(MARKER) !== -1) {
      event.completed({ allowEvent: true });
      return;
    }

    var block = buildBlock(name, room);

    item.body.setAsync(
      current + block,
      { coercionType: Office.CoercionType.Html },
      function (setResult) {
        if (setResult.status === Office.AsyncResultStatus.Succeeded) {
          event.completed({ allowEvent: true });
          return;
        }
        try {
          item.body.appendOnSendAsync(
            block,
            { coercionType: Office.CoercionType.Html },
            function () { event.completed({ allowEvent: true }); }
          );
        } catch (e) {
          event.completed({ allowEvent: true });
        }
      }
    );
  });
}

Office.actions.associate("onAppointmentSendHandler", onAppointmentSendHandler);

</script>
</head>
<body>
</body>
</html>
